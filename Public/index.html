<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>المزاد 🔥</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#25285b,#090b18 65%);color:#fff;min-height:100vh}.app{max-width:1100px;margin:auto;padding:24px}.panel{background:#15182d;border:1px solid #ffffff16;border-radius:24px;box-shadow:0 18px 60px #0007;padding:25px}.center{text-align:center}.logo{font-size:clamp(42px,8vw,90px);font-weight:900;margin:20px 0 8px}.sub{color:#b8bedb;font-size:18px}.input{width:100%;padding:16px;border-radius:14px;border:1px solid #ffffff20;background:#0e1020;color:#fff;font-size:20px;text-align:center;margin:8px 0}.btn{border:0;border-radius:16px;padding:15px 22px;background:#6d5dfc;color:#fff;font-size:20px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.97)}.room{font-size:clamp(45px,10vw,100px);font-weight:900;letter-spacing:12px;color:#ffd84d}.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}.pill{background:#242844;padding:12px 18px;border-radius:999px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.timer{font-size:44px;font-weight:900;color:#ffd84d}.item{margin:22px auto;padding:35px;max-width:780px;text-align:center;border-radius:28px;background:linear-gradient(145deg,#222754,#111429);border:1px solid #ffffff18}.item h1{font-size:clamp(35px,6vw,65px);margin:8px}.item p{font-size:20px;color:#c6cae0}.price{font-size:54px;font-weight:900;color:#ffd84d}.bidder{color:#9de7ff;font-size:21px}.leader{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}.card{background:#20243d;border-radius:16px;padding:14px;text-align:center}.balance{font-size:25px;color:#7cffb2;font-weight:900}.bidbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:15px auto}.quick{background:#242844;border:1px solid #ffffff14}.hide{display:none!important}.note{margin-top:16px;color:#aeb5d6}.win{font-size:clamp(28px,5vw,55px);font-weight:900;color:#7cffb2}.danger{color:#ff7187}.credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#666b86;font-size:12px}
@media(max-width:600px){.app{padding:12px}.panel{padding:17px;border-radius:20px}.top{align-items:flex-start}.timer{font-size:34px}.item{padding:22px}.bidbox{grid-template-columns:1fr}.logo{margin-top:35px}}
</style></head><body><div id="app" class="app"></div><div class="credit">تم إنشاء اللعبة من قبل أغيد</div><script>
const socket=io();const app=document.getElementById('app');let state=null,role=new URLSearchParams(location.search).get('role')||'';let myId=null,code=new URLSearchParams(location.search).get('code')||'';let audioCtx;function beep(freq=500,d=0.08){try{audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){if(!state)return;if(role==='display')renderDisplay();else renderPlayer()}function renderDisplay(){app.innerHTML=`<div class="panel center"><div class="top"><div><div class="sub">رمز الغرفة</div><div class="room">${state.code}</div></div><div>${state.phase==='auction'?`<div class="timer" id="timer"></div>`:''}</div></div>${state.phase==='waiting'?`<h1>بانتظار اللاعبين 👥</h1><div class="sub">ادخلوا الرمز من جوالاتكم</div>`:state.phase==='auction'?`<div class="item"><div class="sub">الجولة ${state.round} من ${state.totalRounds}</div><h1>${esc(state.item.name)}</h1><p>${esc(state.item.desc)}</p><div class="price">${state.bid||0} نقطة</div><div class="bidder">${state.bidder?(esc(state.players.find(p=>p.id===state.bidder)?.name)+' أعلى مزايد 🔥'):'ابدأوا المزايدة!'}</div></div>`:state.phase==='result'?`<div class="item"><div class="sub">نتيجة الجولة ${state.round}</div><div class="win">${state.winner?`🏆 ${esc(state.winner.name)}`:'لم يفز أحد'}</div><div class="price">${state.winner?state.winner.cost+' نقطة':'—'}</div><p>${esc(state.message)}</p></div>`:`<div class="item"><div class="win">🏆 انتهى المزاد!</div><p>${esc(state.message)}</p></div>`}<div class="leader">${[...state.players].sort((a,b)=>b.balance-a.balance).map((p,i)=>`<div class="card"><b>${i+1}. ${esc(p.name)}</b><div class="balance">${p.balance}</div></div>`).join('')}</div></div>`;if(state.phase==='auction')tick()}
function tick(){let el=document.getElementById('timer');if(!el)return;let f=()=>{let n=Math.max(0,state.endsAt-Date.now());el.textContent=Math.ceil(n/1000)+'ث';if(n>0)requestAnimationFrame(f)};f()}
function renderPlayer(){let me=state.players.find(p=>p.id===myId);if(!me){showJoin();return}app.innerHTML=`<div class="panel center"><div class="sub">الغرفة</div><div class="room" style="font-size:45px;letter-spacing:7px">${state.code}</div><h1>مرحبًا ${esc(me.name)} 👋</h1><div class="balance">رصيدك: ${me.balance} نقطة</div>${state.phase==='waiting'?`<div class="item"><h2>بانتظار بدء المزاد…</h2><p>عدد اللاعبين: ${state.players.length}</p></div>`:state.phase==='auction'?`<div class="item"><h2>${esc(state.item.name)}</h2><div class="price">${state.bid||0}</div><p>${state.bidder?`أعلى مزايد: ${esc(state.players.find(p=>p.id===state.bidder)?.name)}`:'كن أول من يزايد!'}</p></div><div class="bidbox"><input id="bid" class="input" type="number" min="1" max="${me.balance}" placeholder="مبلغ المزايدة"><button class="btn" onclick="bid()">زايد 🔥</button><button class="btn quick" onclick="quick(50)">+50</button><button class="btn quick" onclick="quick(100)">+100</button></div>`:state.phase==='result'?`<div class="item"><div class="win">${state.winner?.id===myId?'🏆 فزت!':state.winner?'😈 فاز '+esc(state.winner.name):'لا فائز'}</div><p>${esc(state.message)}</p></div>`:`<div class="item"><div class="win">انتهت اللعبة 🏆</div></div>`}<div class="players">${state.players.map(p=>`<div class="pill">${esc(p.name)} · ${p.balance}</div>`).join('')}</div></div>`}
function bid(){let n=+document.getElementById('bid').value;socket.emit('bid',{amount:n});beep(700)}function quick(x){let me=state.players.find(p=>p.id===myId);let n=Math.max((state.bid||0)+x,50);if(n<=me.balance){socket.emit('bid',{amount:n});beep(900)}}function showJoin(){app.innerHTML=`<div class="panel center"><div class="logo">المزاد 🔥</div><div class="sub">لعبة المزاد الجماعية للأصدقاء</div><input id="name" class="input" maxlength="18" placeholder="اسمك"><input id="code" class="input" inputmode="numeric" maxlength="4" placeholder="رمز الغرفة 4 أرقام" value="${esc(code)}"><button class="btn" onclick="join()">دخول المزاد 🚀</button><div class="note">افتح شاشة العرض أولًا، ثم شارك رمز الغرفة مع أصدقائك.</div></div>`}function join(){let n=document.getElementById('name').value.trim()||'لاعب';let c=document.getElementById('code').value.trim();if(!/^\d{4}$/.test(c))return alert('اكتب رمزًا من 4 أرقام');role='player';code=c;socket.emit('room:join',{code:c,name:n})}function createDisplay(){
 role='display';
 if(code) socket.emit('room:watch',{code});
 else socket.emit('room:create',{name:'display'});
}socket.on('room:created',x=>{code=x.code;history.replaceState({},'',`/display?code=${code}`)});socket.on('joined',x=>{myId=x.id;code=x.code;history.replaceState({},'',`/player?code=${code}`)});socket.on('state',s=>{state=s;render()});socket.on('errorMsg',m=>alert(m));if(location.pathname==='/'||location.pathname==='/display')createDisplay();else showJoin();
</script></body></html>
