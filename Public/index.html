<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المزاد 🔥</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#292d68,#080a14 70%);color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:#14172b;border:1px solid #ffffff18;border-radius:26px;padding:24px;box-shadow:0 18px 55px #0008}.center{text-align:center}.logo{font-size:clamp(52px,10vw,100px);font-weight:900;margin:25px 0 5px}.muted{color:#aeb5d4}.input{display:block;width:100%;max-width:560px;margin:10px auto;padding:16px;border:1px solid #ffffff20;border-radius:15px;background:#0d1020;color:#fff;font-size:20px;text-align:center;outline:none}.btn{border:0;border-radius:15px;padding:15px 22px;background:#6958ff;color:#fff;font-size:19px;font-weight:900;cursor:pointer}.btn:active{transform:scale(.97)}.room{font-size:clamp(52px,11vw,105px);font-weight:1000;letter-spacing:12px;color:#ffd94f}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.timer{font-size:48px;font-weight:1000;color:#ffd94f}.item{max-width:800px;margin:22px auto;padding:30px;border-radius:28px;background:linear-gradient(145deg,#242957,#101325);border:1px solid #ffffff16}.item h1{font-size:clamp(35px,6vw,68px);margin:10px}.item p{font-size:20px;color:#c4c9df}.price{font-size:54px;font-weight:1000;color:#ffd94f}.bidder{font-size:21px;color:#9ce8ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#20243e;border-radius:16px;padding:13px;text-align:center}.balance{font-size:26px;color:#7cffb1;font-weight:1000}.bidbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;margin:16px auto}.quick{background:#252a48}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.pill{background:#252a46;padding:10px 14px;border-radius:999px}.win{font-size:clamp(32px,6vw,62px);font-weight:1000;color:#7cffb1}.note{margin:15px;color:#969fbe}.credit{position:fixed;bottom:7px;left:0;right:0;text-align:center;color:#646b88;font-size:12px}@media(max-width:600px){.wrap{padding:10px}.panel{padding:16px}.top{align-items:flex-start}.timer{font-size:34px}.item{padding:20px}.bidbox{grid-template-columns:1fr}.room{letter-spacing:7px}}
</style>
</head>
<body><main id="app" class="wrap"></main><div class="credit">تم إنشاء اللعبة من قبل أغيد</div>
<script>
const socket=io();const app=document.getElementById('app');const qs=new URLSearchParams(location.search);let role=qs.get('role')||'';let code=qs.get('code')||'';let myId=null;let state=null;let audio;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function beep(f=650,d=.08){try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function display(){app.innerHTML=`<section class="panel center"><div class="top"><div><div class="muted">رمز الغرفة</div><div class="room">${esc(state.code)}</div></div>${state.phase==='auction'?'<div><div class="muted">الوقت</div><div id="timer" class="timer">15</div></div>':''}</div>${displayMain()}<div class="grid">${[...state.players].sort((a,b)=>b.balance-a.balance).map((p,i)=>`<div class="card"><b>${i+1}. ${esc(p.name)}</b><div class="balance">${p.balance}</div></div>`).join('')}</div></section>`;if(state.phase==='auction')timer();}
function displayMain(){if(state.phase==='waiting')return `<div class="item"><div class="logo" style="font-size:60px">المزاد 🔥</div><h2>بانتظار اللاعبين</h2><p>شاركوا رمز الغرفة من جوالاتكم. تبدأ اللعبة تلقائيًا عند دخول لاعبين.</p><div class="players">${state.players.map(p=>`<span class="pill">${esc(p.name)}</span>`).join('')}</div></div>`;if(state.phase==='auction')return `<div class="item"><div class="muted">الجولة ${state.round} من ${state.totalRounds}</div><h1>${esc(state.item.name)}</h1><p>${esc(state.item.desc)}</p><div class="price">${state.bid} نقطة</div><div class="bidder">${state.bidder?(esc(state.players.find(p=>p.id===state.bidder)?.name)||'لاعب')+' أعلى مزايد 🔥':'ابدأوا المزايدة!'}</div></div>`;if(state.phase==='result')return `<div class="item"><div class="muted">نتيجة الجولة ${state.round}</div><div class="win">${state.winner?'🏆 '+esc(state.winner.name):'لا فائز'}</div><div class="price">${state.winner?state.winner.cost+' نقطة':'—'}</div><p>${esc(state.message)}</p></div>`;return `<div class="item"><div class="win">🏆 انتهى المزاد!</div><p>${esc(state.message)}</p></div>`}
function timer(){const el=document.getElementById('timer');if(!el)return;const loop=()=>{if(!state||state.phase!=='auction'||!el.isConnected)return;const n=Math.max(0,state.endsAt-Date.now());el.textContent=Math.ceil(n/1000)+' ث';if(n>0)requestAnimationFrame(loop)};loop()}
function player(){const me=state?.players.find(p=>p.id===myId);if(!me)return joinScreen();app.innerHTML=`<section class="panel center"><div class="muted">الغرفة</div><div class="room" style="font-size:48px;letter-spacing:7px">${esc(state.code)}</div><h1>أهلًا ${esc(me.name)} 👋</h1><div class="balance">رصيدك: ${me.balance} نقطة</div>${playerMain(me)}<div class="players">${state.players.map(p=>`<span class="pill">${esc(p.name)} · ${p.balance}</span>`).join('')}</div></section>`}
function playerMain(me){if(state.phase==='waiting')return `<div class="item"><h2>بانتظار بداية المزاد…</h2><p>عدد اللاعبين: ${state.players.length}</p></div>`;if(state.phase==='auction')return `<div class="item"><h2>${esc(state.item.name)}</h2><p>${esc(state.item.desc)}</p><div class="price">${state.bid} نقطة</div><p>${state.bidder?'أعلى مزايد: '+esc(state.players.find(p=>p.id===state.bidder)?.name):'كن أول من يزايد!'}</p></div><div class="bidbox"><input id="bid" class="input" type="number" min="1" max="${me.balance}" placeholder="مبلغ المزايدة"><button class="btn" onclick="bid()">زايد 🔥</button><button class="btn quick" onclick="quick(50)">+50</button><button class="btn quick" onclick="quick(100)">+100</button></div>`;if(state.phase==='result')return `<div class="item"><div class="win">${state.winner?.id===myId?'🏆 فزت!':state.winner?'😈 فاز '+esc(state.winner.name):'لا فائز'}</div><p>${esc(state.message)}</p></div>`;return `<div class="item"><div class="win">انتهت اللعبة 🏆</div><p>${esc(state.message)}</p></div>`}
function joinScreen(){app.innerHTML=`<section class="panel center"><div class="logo">المزاد 🔥</div><div class="muted">لعبة مزاد جماعية للأصدقاء</div><input id="name" class="input" maxlength="18" placeholder="اسمك"><input id="code" class="input" inputmode="numeric" maxlength="4" placeholder="رمز الغرفة 4 أرقام" value="${esc(code)}"><button class="btn" onclick="join()">دخول المزاد 🚀</button><div class="note">افتح شاشة العرض أولًا ثم شارك رمز الغرفة.</div></section>`}
function join(){const name=document.getElementById('name').value.trim()||'لاعب';const c=document.getElementById('code').value.trim();if(!/^\d{4}$/.test(c))return alert('اكتب رمز الغرفة من 4 أرقام');role='player';code=c;socket.emit('room:join',{code:c,name})}
function bid(){const el=document.getElementById('bid');if(!el)return;const n=Math.floor(Number(el.value));socket.emit('bid',{amount:n});beep(800)}
function quick(x){const me=state.players.find(p=>p.id===myId);const n=(state.bid||0)+x;if(me&&n<=me.balance){socket.emit('bid',{amount:n});beep(900)}}
socket.on('room:created',x=>{code=x.code;history.replaceState({},'',`/display?code=${encodeURIComponent(code)}`)});socket.on('joined',x=>{myId=x.id;code=x.code;history.replaceState({},'',`/player?code=${encodeURIComponent(code)}`)});socket.on('state',s=>{state=s;role==='display'?display():player()});socket.on('errorMsg',m=>alert(m));
function boot(){if(location.pathname==='/'||location.pathname==='/display'){role='display';if(code)socket.emit('room:watch',{code});else socket.emit('room:create')}else{role='player';joinScreen()}}boot();
</script></body></html>
