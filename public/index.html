const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tone(freq=440,d=.16,type='sine',gain=.14){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle',.12),i*110))}function revealSound(){[330,440,554,660].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.10),i*65))}function awardSound(){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.11),i*75))}function clickSound(){tone(330,.07,'square',.06)}function toggleSound(){soundOn=!soundOn;toast(soundOn?'🔊 المؤثرات مفعلة':'🔇 المؤثرات مكتومة');if(soundOn)tone(660,.12,'triangle')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
function logo(){return `<div class="brand"><div class="mark">🏆</div><div><div>لعبة العائلة</div><div class="muted" style="font-size:11px">FAMILY FEUD • PLAYER ONLY</div></div></div>`}
function modal(html){let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="modalBox">${html}</div>`;document.body.appendChild(m)}function closeModal(){$('modal')?.remove()}
function home(){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="toggleSound()">🔊 الصوت</button></div><section class="card hero"><div class="pill">📱 شاشة واحدة للجميع</div><h1>لعبة العائلة</h1><p class="sub">نفس أسلوب Family Feud — بدون مقدم وبدون شاشة عرض. كل اللاعبين يدخلون من نفس الصفحة، وكل شيء يظهر لهم مباشرة.</p><div class="grid" style="margin-top:28px"><button class="btn primary" onclick="showCreate()">✨ إنشاء لعبة</button><button class="btn red" onclick="showJoin()">🎮 دخول لعبة</button><button class="btn dark" onclick="showHow()">❓ طريقة اللعب</button></div></section></div>`}
function showHow(){modal(`<h2>🎬 طريقة اللعب</h2><p class="muted">أنشئوا الغرفة، اختاروا الفريقين، ثم كل لاعب يدخل من جواله. أي لاعب يستطيع بدء السؤال، وكتابة الإجابة مباشرة من جواله. إذا كانت الإجابة صحيحة تُكشف وتُحتسب نقاطها فورًا للفريق، وإذا كانت خاطئة تُحسب Strike. يمكن أيضًا كشف الإجابات يدويًا والانتقال للسؤال التالي. لا توجد صفحة مقدم ولا شاشة عرض منفصلة.</p><button class="btn primary" onclick="closeModal()">فهمت</button>`)}
function showCreate(){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>✨ إنشاء لعبة</h1><div class="grid"><div><label class="label">اسمك</label><input class="input" id="pn" placeholder="اكتب اسمك" autofocus></div><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="ta" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="tb" value="الفريق الأزرق"></div></div><label class="label">فريقك</label><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn primary" style="width:100%;margin-top:10px" onclick="createGame()">🚀 إنشاء اللعبة</button></section></div>`}
function showJoin(pref=''){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card"><h1>🎮 دخول اللعبة</h1><input class="input" id="pc" placeholder="رمز الغرفة (4 أرقام)" inputmode="numeric" maxlength="4" value="${esc(pref)}"><button class="btn dark" onclick="lookupTeams()">تحميل أسماء الفرق</button><input class="input" id="pn" placeholder="اسمك"><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn red" style="width:100%" onclick="joinGame()">دخول اللعبة 🚀</button></section></div>`}
function createGame(){const name=$('pn').value.trim(),rounds=+$('rounds').value||5,team=$('pt').value;if(!name)return toast('اكتب اسمك');clickSound();socket.emit('player:create',{name,rounds,team,teamA:$('ta').value,teamB:$('tb').value})}
function lookupTeams(){const c=$('pc').value.trim();if(!/^\d{4}$/.test(c))return toast('رمز الغرفة يجب أن يكون 4 أرقام');code=c;socket.emit('player:lookup',{code:c})}
function joinGame(){const c=$('pc').value.trim(),name=$('pn').value.trim(),team=$('pt').value;if(!/^\d{4}$/.test(c))return toast('رمز الغرفة يجب أن يكون 4 أرقام');if(!name)return toast('اكتب اسمك');code=c;playerName=name;playerTeam=team;history.replaceState({},'',`/player?join=${encodeURIComponent(c)}`);socket.emit('player:join',{code:c,name,team})}
function renderGame(s){
  lastState=s;
  const me=s.teams.find(t=>t.id===playerTeam);
  const bank=s.questionBank||[];
  const canControl=!!me;
  const canStart=s.currentRound<s.rounds&&s.phase!=='finished'&&bank.length;
  const winner=s.phase==='finished'?(s.teams[0].score===s.teams[1].score?'تعادل!':s.teams[0].score>s.teams[1].score?s.teams[0].name:s.teams[1].name):'';
  const myDoubleAvailable=!!me&&!me.doubleUsed&&!s.answerLock&&s.phase==='question';
  const myTurn=!!s.answerLock&&s.answerLock.name===playerName;
  const actionButtons=s.phase==='question'&&!s.answerLock?`
    <div class="answerActions">
      <button class="btn gold answerBtn" onclick="answerReady()">✍️ أجاوب كتابيًا<span>10 ثواني</span></button>
      ${myDoubleAvailable?`<button class="btn doubleBtn" onclick="doubleAnswer()">⚡ دبل + إجابة<span>10 ثواني • مرة واحدة</span></button>`:''}
    </div>`:'';
  app.innerHTML=`<div class="stage"><div class="tv">
    <div class="card tvCard">
      <div class="broadcastHeader">
        <div>${logo()}</div>
        <div class="tvMeta"><span class="pill">🏠 ${esc(s.code)}</span><span class="roundBadge">السؤال ${s.currentRound||0} / ${s.rounds}</span><button class="btn dark" onclick="shareCode()">📤</button><button class="btn dark" onclick="toggleSound()">🔊</button></div>
      </div>
      <div class="tvTeams">${s.teams.map(t=>teamCard(t)).join('')}</div>
      <section class="questionPanel">
        <div class="questionLabel">🎯 السؤال</div>
        <h2 class="tvQuestion">${esc(s.question||'جاهزين؟ ابدأوا بسؤال عشوائي.')}</h2>
        ${s.lock?`<div class="buzz">🔔 ${esc(s.lock.name)} ضغط أولًا — ${esc(s.teams.find(t=>t.id===s.lock.team)?.name||'')}</div>`:''}
        ${s.answerLock?`<div class="answerTurn ${s.answerLock.double?'doubleTurn':''}"><div><b>${s.answerLock.double?'⚡ دبل — ': '✍️ '}${esc(s.answerLock.name)} يجاوب الآن</b><small>${esc(s.teams.find(t=>t.id===s.answerLock.team)?.name||'')}</small></div><div class="answerTimer" id="answerTimer">10</div></div>`:''}
        ${myTurn?`<div class="liveAnswer"><input class="input" id="answerInput" autocomplete="off" autocapitalize="off" placeholder="${s.answerLock.double?'اكتب إجابتك — النقاط ×2':'اكتب إجابتك هنا...'}" maxlength="120" onkeydown="if(event.key==='Enter'){event.preventDefault();submitAnswer()}"><button class="btn primary" onclick="submitAnswer()">إرسال 🚀</button></div>`:actionButtons}
        <div id="answerFeedback" class="answerFeedback"></div>
      </section>
      <div class="answers tvAnswers">${(s.answers||[]).map((a,i)=>`
        <div class="answer ${a.revealed?'revealed':'hiddenAns'}">
          <div class="answerMain"><span class="answerNum">${i+1}</span><span class="answerText">${a.revealed?esc(a.text):'؟'}</span>${a.revealed?`<span class="pts">${a.points}</span>`:''}</div>
          <small>${a.revealed?(a.awarded?'✓ تم احتسابها':'✓ مكشوفة'):'🔒 مخفية'}</small>
          <div class="answerControls">${!a.revealed?`<button class="btn red" onclick="reveal(${i})">👁️ كشف</button>`:''}${a.revealed&&!a.awarded?`<button class="btn red" onclick="awardAnswer(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="awardAnswer(${i},'B')">🔵 +${a.points}</button>`:''}</div>
        </div>`).join('')}</div>
      ${winner?`<div class="winner">🎉 ${esc(winner)} 🎉</div>`:''}
      <div class="bottomActions">
        ${s.phase==='lobby'&&canStart?`<button class="btn gold" onclick="startRandom()">🎲 ابدأ بسؤال عشوائي</button>`:''}
        ${s.phase==='question'?`<button class="btn primary" onclick="nextQuestion()" ${s.currentRound>=s.rounds?'disabled':''}>🎲 سؤال عشوائي</button>`:''}
        <button class="btn dark" onclick="resetScores()">تصفير النقاط</button>
        ${s.phase==='question'?`<button class="btn danger" onclick="endGame()">إنهاء اللعبة</button>`:''}
      </div>
      ${s.phase==='lobby'?`<div class="lobbyPlayers"><h3>👥 اللاعبين</h3><div class="grid">${s.teams.map(t=>`<div class="bankRow"><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد'}</div></div>`).join('')}</div></div>`:''}
    </div>
  </div></div>`;
  if(myTurn)setTimeout(()=>{$('answerInput')?.focus()},40);
}
function teamCard(t){
  return `<div class="tvTeam ${t.id==='A'?'a':'b'}">
    <div class="tvTeamLeft"><div class="tvTeamName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد متسابقون'}</div></div>
    <div class="tvScore">${t.score}</div>
    <div class="tvStrikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div>
    <div class="teamTools"><span class="pill">${t.doubleUsed?'⚡ الدبل مستخدم':'⚡ الدبل متاح'}</span><button class="btn danger" onclick="strike('${t.id}')" ${lastState?.phase==='question'?'':'disabled'}>Strike</button></div>
  </div>`;
}
function startRandom(){const bank=lastState.questionBank||[];let choices=bank.map((_,i)=>i).filter(i=>i!==lastState.questionIndex);if(!choices.length)choices=[0];socket.emit('player:startRound',{code,questionIndex:choices[Math.floor(Math.random()*choices.length)]})}
function answerReady(){socket.emit('player:answerReady',{code})}function doubleAnswer(){socket.emit('player:double',{code})}function startAnswerTimer(until){clearInterval(window.answerTimerTick);const tick=()=>{const el=$('answerTimer');if(!el)return;const sec=Math.max(0,Math.ceil((until-Date.now())/1000));el.textContent=sec;if(sec<=0)clearInterval(window.answerTimerTick)};tick();window.answerTimerTick=setInterval(tick,100)}function submitAnswer(){const el=$('answerInput');const text=el?.value.trim();if(!text)return toast('اكتب إجابتك أولاً');el.blur();socket.emit('player:submitAnswer',{code,answer:text})}function nextQuestion(){socket.emit('player:nextQuestion',{code})}function reveal(i){revealSound();socket.emit('player:reveal',{code,index:i})}function awardAnswer(index,team){awardSound();socket.emit('player:award',{code,team,answerIndex:index})}function strike(team){tone(120,.35,'sawtooth',.18);socket.emit('player:strike',{code,team})}function resetStrike(team){socket.emit('player:resetStrikes',{code,team})}function resetScores(){if(confirm('تصفير النقاط؟'))socket.emit('player:resetScores',{code})}function endGame(){if(confirm('إنهاء اللعبة؟'))socket.emit('player:end',{code})}
function shareCode(){modal(`<h2>📤 مشاركة اللعبة</h2><p>رمز الغرفة:</p><div style="font-size:52px;font-weight:1000;letter-spacing:8px;text-align:center">${esc(code)}</div><p class="muted">أرسل الرمز للاعبين الآخرين، وكل واحد يدخل من نفس الصفحة.</p><button class="btn primary" onclick="closeModal()">إغلاق</button>`)}
socket.on('game:created',x=>{code=x.code;playerTeam=x.team;playerName=x.name;history.replaceState({},'',`/player?join=${encodeURIComponent(code)}`);toast('تم إنشاء الغرفة '+code);setTimeout(()=>{},0)});socket.on('player:teams',teams=>{const sel=$('pt');if(sel){sel.innerHTML=teams.map(t=>`<option value="${t.id}">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</option>`).join('');toast('تم تحميل أسماء الفرق')}});socket.on('player:joined',x=>{playerTeam=x.team;playerName=x.name;toast('مرحبًا '+x.name)});socket.on('double:activated',()=>{tone(660,.5,'triangle',.18)});socket.on('buzzer:locked',()=>{tone(880,.35,'square',.18)});socket.on('answer:ready',x=>{tone(880,.25,'square',.16);startAnswerTimer(x.until);setTimeout(()=>{const el=$('answerInput');if(el)el.focus()},30)});socket.on('answer:timeout',()=>{clearInterval(window.answerTimerTick);const fb=$('answerFeedback');if(fb){fb.className='answerFeedback bad';fb.textContent='⏱️ انتهت الـ10 ثواني — الدور لغيرك'}});socket.on('answer:correct',x=>{clearInterval(window.answerTimerTick);awardSound();const el=$('answerInput'),fb=$('answerFeedback');if(fb)fb.className='answerFeedback good';if(fb)fb.textContent=x.smart?`🧠 صح! حسبناها حتى مع الخطأ الإملائي — +${x.points} نقطة`:`✅ إجابة صحيحة — +${x.points} نقطة`;if(el)el.value=''});socket.on('answer:wrong',x=>{clearInterval(window.answerTimerTick);tone(120,.22,'sawtooth',.2);const fb=$('answerFeedback');if(fb)fb.className='answerFeedback bad';if(fb)fb.textContent=`❌ ليست ضمن الإجابات — Strike ${x.strikes}/3`});socket.on('answer:result',x=>toast('⚠️ '+x.message));socket.on('state',s=>{if(s.phase==='finished'&&lastState?.phase!=='finished')fanfare();lastState=s;renderGame(s)});socket.on('error:msg',m=>toast('⚠️ '+m));
const params=new URLSearchParams(location.search);const join=params.get('join')||'';if(join)showJoin(join);else home();
</script></body></html>
