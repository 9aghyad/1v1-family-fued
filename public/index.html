<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Feud — الساحة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#070812;color:#fff}
body{background:radial-gradient(circle at 50% -10%,#51439b 0,#12162a 34%,#06070d 78%);padding:18px}
.wrap{width:min(980px,96vw);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:900;color:#b9b1ff}.back,.quick a{color:#fff;text-decoration:none;border:1px solid #3b4666;background:#10162a;padding:10px 15px;border-radius:14px}
.card{background:rgba(12,16,30,.94);border:1px solid #303a5a;border-radius:30px;padding:28px;box-shadow:0 25px 80px #0009}
h1{font-size:clamp(34px,7vw,64px);margin:0 0 8px}.sub{color:#aeb6cb;line-height:1.8}
label{display:block;color:#c9d0df;margin:16px 0 8px}.input,select{width:100%;padding:15px 16px;border-radius:16px;border:1px solid #394563;background:#080d1b;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.mode{position:relative;padding:22px 15px;border-radius:22px;border:1px solid #35415f;background:#0d1427;color:#fff;text-align:right;cursor:pointer;min-height:145px;transition:.2s}.mode:hover{transform:translateY(-3px);border-color:#7562ff}.mode.selected{border:2px solid #7562ff;background:linear-gradient(145deg,#241c51,#10162a);box-shadow:0 0 30px #6c5ce733}.mode .ico{font-size:34px}.mode h2{margin:10px 0 5px;font-size:21px}.mode p{margin:0;color:#aeb6cb;line-height:1.6;font-size:14px}
.rounds{display:flex;gap:10px;flex-wrap:wrap}.round{flex:1;min-width:100px;padding:13px;border-radius:15px;border:1px solid #35415f;background:#0d1427;color:#fff;cursor:pointer}.round.selected{background:#7562ff;border-color:#8d7dff}
.primary{width:100%;margin-top:22px;padding:17px;border:0;border-radius:18px;background:linear-gradient(135deg,#6d4cff,#8d62ff);color:#fff;font-size:19px;font-weight:900;cursor:pointer}
.note{margin-top:14px;color:#929bb2;text-align:center;font-size:13px}.quick{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.quick a{font-size:13px}
#nameWrap{display:none}
@media(max-width:720px){.grid{grid-template-columns:1fr}.card{padding:20px}.mode{min-height:0}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">الساحة • Family Feud</div><a class="back" href="/">الساحة</a></div>
  <section class="card">
    <div style="text-align:center">
      <div style="font-size:42px">👨‍👩‍👧‍👦</div>
      <h1>Family Feud</h1>
      <div class="sub">اختر طريقة اللعب قبل إنشاء الغرفة</div>
    </div>

    <label>طريقة اللعب</label>
    <div class="grid">
      <button class="mode selected" data-mode="presenter" onclick="pick('presenter',this)">
        <div class="ico">🎤</div><h2>مقدم + شاشة + لاعبين</h2>
        <p>المقدم يدير الجولة، الشاشة تعرض اللعبة، واللاعبون يجيبون من أجهزتهم.</p>
      </button>
      <button class="mode" data-mode="display" onclick="pick('display',this)">
        <div class="ico">📺</div><h2>شاشة + لاعبين</h2>
        <p>بدون مقدم. الشاشة تدير الجولة وتعرض الإجابات، واللاعبون يجيبون كتابة.</p>
      </button>
      <button class="mode" data-mode="players" onclick="pick('players',this)">
        <div class="ico">🎮</div><h2>لاعبين فقط</h2>
        <p>كل اللعبة من أجهزة اللاعبين، مع الإجابة الكتابية والدبل والمؤثرات.</p>
      </button>
    </div>

    <div id="nameWrap">
      <label id="nameLabel">اسمك</label>
      <input id="name" class="input" placeholder="اكتب اسمك">
    </div>

    <label>عدد الجولات</label>
    <div class="rounds">
      <button class="round selected" onclick="rounds(5,this)">5</button>
      <button class="round" onclick="rounds(10,this)">10</button>
      <button class="round" onclick="rounds(15,this)">15</button>
      <button class="round" onclick="rounds(20,this)">20</button>
    </div>

    <button class="primary" onclick="createRoom()">✨ إنشاء اللعبة</button>
    <div class="note" id="hint">بعد الإنشاء سيظهر لك كود الغرفة والرابط المناسب للطريقة المختارة.</div>

    <div class="quick">
      <a href="presenter.html">🎤 دخول المقدم</a>
      <a href="display.html">📺 دخول الشاشة</a>
      <a href="players.html">🎮 دخول اللاعبين</a>
    </div>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); let selected='presenter', selectedRounds=5;
function pick(mode,el){
 selected=mode; document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected')); el.classList.add('selected');
 const nw=document.getElementById('nameWrap'); nw.style.display=mode==='presenter'?'none':'block';
 document.getElementById('nameLabel').textContent=mode==='display'?'اسم اللاعب الذي ينشئ الغرفة':'اسمك';
}
function rounds(n,el){selectedRounds=n;document.querySelectorAll('.round').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function createRoom(){
 const name=(document.getElementById('name').value||'').trim();
 if(selected!=='presenter'&&!name){document.getElementById('name').focus();return}
 socket.emit('room:create',{game:'family',mode:selected,rounds:selectedRounds,name:name||'المقدم',team:'A'});
}
socket.on('room:created',x=>{
 const q=new URLSearchParams({code:x.code});
 if(selected==='presenter') location.href='presenter.html?'+q;
 else location.href='players.html?'+q+'&name='+encodeURIComponent(document.getElementById('name').value.trim())+'&team=A';
});
socket.on('errorMsg',x=>alert(x));
</script>
</body></html>
