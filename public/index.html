<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الساحة</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#070812;color:#fff}body{background:radial-gradient(circle at 50% -10%,#3b2a77 0,#111426 38%,#06070d 100%)}button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{width:min(1180px,96vw);margin:auto;padding:18px}.card{background:rgba(14,17,31,.93);border:1px solid #343952;border-radius:28px;padding:22px;box-shadow:0 25px 90px #0009;backdrop-filter:blur(8px)}.hero{padding:54px 24px;text-align:center;border-radius:32px;background:radial-gradient(circle at 50% 0,#51439b,#12172a 58%,#0a0c15);border:1px solid #5a4fa0}.title{font-size:clamp(46px,8vw,88px);font-weight:1000;margin:0}.sub,.muted{color:#aeb5ca;line-height:1.8}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.game{padding:22px;border-radius:24px;background:linear-gradient(145deg,#171d31,#0e1322);border:1px solid #303a58;transition:.2s;position:relative;overflow:hidden}.game:hover{transform:translateY(-3px);border-color:#7866e8}.game .ico{font-size:46px}.game h2{margin:8px 0}.btn{padding:13px 17px;border-radius:15px;font-weight:1000;background:#e9edf6;color:#111521}.primary{background:#765cff;color:#fff}.red{background:#e83d55;color:#fff}.blue{background:#2588ee;color:#fff}.gold{background:#e5b638;color:#211700}.green{background:#1c9d68;color:#fff}.dark{background:#20283d;color:#fff}.danger{background:#7d2838;color:#fff}.input,select{width:100%;background:#080d19;color:#fff;border:1px solid #3a4560;border-radius:14px;padding:14px;margin:7px 0 12px;outline:none}.pill{display:inline-flex;padding:8px 12px;border-radius:999px;background:#1b2438;border:1px solid #35415e;color:#d9def0}.code{font-size:40px;font-weight:1000;letter-spacing:8px;color:#ffd75b}.mode{padding:18px;border:2px solid #303b59;border-radius:20px;background:#111829;color:#fff;text-align:right}.mode.selected{border-color:#826bff;background:#211b43;box-shadow:0 0 0 3px #826bff22}.scoreline{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:#151c2e;border-radius:15px;margin:8px 0}.score{font-size:58px;font-weight:1000}.team{padding:18px;border-radius:22px;background:#101829;border:2px solid #35415c}.team.a{border-color:#8d3546}.team.b{border-color:#2c70b4}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.q{font-size:clamp(30px,5vw,60px);font-weight:1000;text-align:center;margin:25px 0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ans{min-height:100px;border-radius:18px;background:#1b2942;border:2px solid #35445f;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;font-weight:1000;text-align:center}.ans.hidden{background:linear-gradient(145deg,#263756,#11192a)}.reveal{animation:pop .4s ease}@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}.bigBtn{width:100%;min-height:190px;font-size:40px;border-radius:30px}.playerButtons{display:grid;grid-template-columns:1fr 1fr;gap:14px}.timer{font-size:58px;font-weight:1000;color:#ffd75b;text-align:center}.buzz{padding:18px;border-radius:18px;background:#382532;border:1px solid #714050;text-align:center;font-size:22px;font-weight:1000}.notice{padding:14px 16px;border-radius:16px;background:#111729;border:1px solid #303b57;line-height:1.7}.miniHero{text-align:center;padding:38px;border-radius:26px;background:linear-gradient(145deg,#171e35,#0e1322)}.marketQ{font-size:clamp(30px,5vw,58px);font-weight:1000;text-align:center;margin:24px 0}.pointsTag{display:inline-flex;padding:10px 16px;border-radius:999px;background:#4b3911;color:#ffe07b;border:1px solid #80611c;font-weight:1000}.press{width:min(540px,100%);aspect-ratio:1/0.55;border-radius:50px;font-size:50px;font-weight:1000;background:linear-gradient(145deg,#ee4057,#8f1830);color:white;box-shadow:0 20px 60px #ee405744,inset 0 3px 0 #ffffff44;animation:pulse 1s infinite}.press:disabled{opacity:.4;animation:none}@keyframes pulse{50%{transform:scale(1.015)}}.winner{padding:18px;border-radius:20px;background:linear-gradient(145deg,#3b2b11,#19150b);border:1px solid #8a6820;text-align:center}.million{background:radial-gradient(circle at 50% 0,#5d4a12,#171624 45%,#08080f)}.ladder{display:grid;gap:7px}.step{display:flex;justify-content:space-between;padding:10px 13px;border-radius:12px;background:#151b2a}.step.active{background:#5b4611;border:1px solid #c99b29;transform:scale(1.02)}.step.safe{box-shadow:inset 4px 0 #4fc58d}.millionQ{font-size:clamp(26px,4vw,45px);font-weight:1000;text-align:center;padding:20px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:20px;border-radius:18px;background:#171e30;border:2px solid #35425e;color:#fff;font-weight:1000;text-align:right}.opt:hover{border-color:#9b7dff;background:#211b3e}.lifelines{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.life{padding:14px;border-radius:16px;background:#1b2438;color:#fff}.life.off{opacity:.35}.podium{display:flex;align-items:end;justify-content:center;gap:12px;min-height:260px}.place{width:30%;text-align:center;padding:18px;border-radius:20px 20px 5px 5px;background:#171d2e;border:1px solid #414a64}.place.first{min-height:220px}.place.second{min-height:170px}.place.third{min-height:130px}.rank{display:flex;justify-content:space-between;padding:14px;background:#151b2b;border-radius:14px;margin:8px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:#171c2e;border:1px solid #535e7d;padding:14px 18px;border-radius:16px;box-shadow:0 15px 50px #000b;max-width:90%;text-align:center}.hidden{display:none!important}@media(max-width:760px){.teams,.playerButtons{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.lifelines{grid-template-columns:1fr 1fr}.wrap{padding:10px}.card{padding:16px}.press{font-size:34px}.code{font-size:32px}}

/* Modern Arena 2026 skin */
:root{--bg:#05060b;--panel:rgba(14,17,29,.78);--line:rgba(255,255,255,.10);--muted:#a7afc4;--violet:#7c5cff;--cyan:#35d8ff;--pink:#ff4f81;--gold:#ffd166}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(124,92,255,.34),transparent 65%),radial-gradient(700px 500px at 10% 20%,rgba(53,216,255,.12),transparent 60%),#05060b;letter-spacing:.1px}
.wrap{width:min(1320px,96vw);padding:24px}.card,.game,.hero{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,24,41,.88),rgba(8,10,18,.94));box-shadow:0 28px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.hero{position:relative;overflow:hidden;padding:72px 28px;border-radius:38px}.hero:before{content:"";position:absolute;inset:-80px;background:conic-gradient(from 180deg,transparent,rgba(124,92,255,.16),transparent 35%,rgba(53,216,255,.12),transparent 70%);filter:blur(40px);pointer-events:none}.title{position:relative;text-shadow:0 0 35px rgba(124,92,255,.35)}
.game{min-height:245px;transition:transform .22s,border-color .22s,box-shadow .22s}.game:hover{transform:translateY(-7px) scale(1.01);border-color:rgba(124,92,255,.55);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 35px rgba(124,92,255,.10)}
.game .ico{filter:drop-shadow(0 10px 20px rgba(124,92,255,.25))}.btn{position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .16s,filter .16s,box-shadow .16s}.btn:hover{box-shadow:0 14px 36px rgba(0,0,0,.32)}.btn:active{transform:translateY(1px) scale(.98)}
.primary{background:linear-gradient(135deg,#8b6cff,#6246e9)}.red{background:linear-gradient(135deg,#ff587f,#d92f57)}.gold{background:linear-gradient(135deg,#ffd86a,#e9aa2e)}.green{background:linear-gradient(135deg,#38d99c,#159a68)}.blue{background:linear-gradient(135deg,#43a5ff,#2870d9)}
.mode{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.10);transition:.18s}.mode:hover,.mode.selected{transform:translateY(-2px);border-color:rgba(124,92,255,.8);background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(53,216,255,.06));box-shadow:0 10px 30px rgba(124,92,255,.12)}
.input,select{background:rgba(4,7,14,.72);border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 10px rgba(0,0,0,.25)}
.bigBtn{box-shadow:0 25px 70px rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.12);min-height:220px}.press{box-shadow:0 30px 90px rgba(238,64,87,.25),inset 0 3px 0 rgba(255,255,255,.18);animation:pulse 1s infinite,glow 2s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.12);box-shadow:0 30px 110px rgba(255,79,129,.42)}}
.marketQ,.q,.millionQ{letter-spacing:-.6px}.ans,.opt,.step,.scoreline{border-color:rgba(255,255,255,.09);background:rgba(255,255,255,.035)}.ans.reveal{box-shadow:0 0 0 2px rgba(53,216,255,.22),0 12px 35px rgba(53,216,255,.10)}
.stageFlash{animation:stageFlash .55s ease}@keyframes stageFlash{0%{filter:brightness(2)}100%{filter:brightness(1)}}.winner{box-shadow:0 0 60px rgba(255,209,102,.12)}
.credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#666d86;font-size:11px;pointer-events:none}
</style><style id="v17-modern">
:root{--glow:#7c5cff;--cyan:#36d9ff;--pink:#ff4d78}body{background:radial-gradient(circle at 15% 10%,rgba(124,92,255,.20),transparent 28%),radial-gradient(circle at 85% 15%,rgba(54,217,255,.12),transparent 25%),linear-gradient(135deg,#05060d,#0a0e19 48%,#080912);background-attachment:fixed}.card{background:linear-gradient(145deg,rgba(18,23,42,.94),rgba(8,11,21,.96));border-color:rgba(255,255,255,.10);box-shadow:0 28px 90px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.04)}.game{background:linear-gradient(145deg,rgba(29,37,62,.92),rgba(11,15,28,.96));border-color:rgba(255,255,255,.09);box-shadow:0 14px 35px rgba(0,0,0,.18)}.game:hover{box-shadow:0 18px 50px rgba(124,92,255,.18),inset 0 1px 0 rgba(255,255,255,.08)}.btn{box-shadow:0 8px 22px rgba(0,0,0,.18)}.press{position:relative;overflow:hidden;box-shadow:0 22px 65px rgba(238,64,87,.28),inset 0 2px 0 rgba(255,255,255,.24)}.press:after{content:"";position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-45%);animation:sweep 2.1s linear infinite}@keyframes sweep{to{transform:translateX(45%)}}.winner{box-shadow:0 0 55px rgba(255,209,102,.12),inset 0 1px 0 rgba(255,255,255,.05)}.stageFlash{animation:stageFlash .55s ease,cardPop .45s ease}@keyframes cardPop{from{transform:scale(.97);opacity:.7}to{transform:scale(1);opacity:1}}.miniHero{background:radial-gradient(circle at 50% 0,rgba(124,92,255,.20),transparent 55%),linear-gradient(145deg,#151d35,#090d19);border:1px solid rgba(255,255,255,.08)}.marketQ,.millionQ,.q{text-shadow:0 8px 35px rgba(124,92,255,.16)}.timer{filter:drop-shadow(0 0 14px rgba(255,215,91,.25))}.score{filter:drop-shadow(0 10px 30px rgba(124,92,255,.15))}.doubleStorm{backdrop-filter:blur(1px)}
</style></head><body><div id="app"></div><script>
const socket=io();let G=null,me=null,role='',mode='',code='';let audioCtx=null;
const games=[['family','👨‍👩‍👧‍👦','Family Feud','تحدي الفرق وكشف الإجابات والدبل.'],['guess','🧠','خمنها','كلمة سرية، كشف، تخمين، ونقاط مستمرة.'],['market','💰','السوق','أجب بسرعة ثم خَلِّ البقية يحكمون.'],['bomb','💣','المفخخة','إجابة سريعة… لكن انتبه للمفاجأة.'],['last','🏆','الصملة','كل جولة أصعب من اللي قبلها.'],['bank','🏦','البنك','مخاطرة أعلى = مكسب أو خسارة أكبر.'],['million','👑','المليون','اصعد حتى القمة أو خاطر بكل شيء.']];
const cats=['🐾 حيوانات','🍔 أكلات','🎬 أفلام وشخصيات','🌍 أماكن','🏠 أشياء يومية','⚽ رياضات','⚽ لاعبين كرة قدم معروفين','👨‍💼 وظائف','✨ أشياء غريبة وممتعة','💎 أشياء فاخرة'];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const audioFiles={click:'/audio/click.wav',buzz:'/audio/buzz.wav',tick:'/audio/tick.wav',win:'/audio/win.wav',wrong:'/audio/wrong.wav',reveal:'/audio/reveal.wav',vote:'/audio/vote.wav',million:'/audio/million.wav',suspense:'/audio/suspense.wav',explosion:'/audio/explosion.wav',countdown:'/audio/countdown.wav'};
function sound(kind){try{const a=new Audio(audioFiles[kind]||audioFiles.click);a.volume=kind==='buzz'?.7:.58;a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function set(x){document.getElementById('app').innerHTML=`<div class="wrap">${x}</div>`}
function home(){set(`<div class="hero"><div class="pill">PLAY • COMPETE • WIN</div><h1 class="title">الساحة</h1><p class="sub">منصة ألعاب جماعية واحدة — كل لعبة لها نظامها وأجواؤها ومؤثراتها.</p><div class="row" style="max-width:760px;margin:24px auto 0"><button class="btn red" style="font-size:20px" onclick="joinForm()">🎮 دخول غرفة</button><button class="btn dark" style="font-size:20px" onclick="displayForm()">🖥️ شاشة عرض</button></div></div><div class="grid" style="margin-top:18px">${games.map(g=>`<div class="game"><div class="ico">${g[1]}</div><h2>${g[2]}</h2><p class="muted">${g[3]}</p><button class="btn primary" onclick="createForm('${g[0]}')">✨ إنشاء غرفة</button><div class="small" style="margin-top:12px">تم إنشاء اللعبة من قبل أغيد</div></div>`).join('')}</div>`)}
function modes(t){if(t==='guess')return '';return `<h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" id="m-presenter" onclick="pickMode('presenter')">🎙️ مقدم + شاشة</button><button class="mode" id="m-display" onclick="pickMode('display')">🖥️ شاشة + لاعبين</button><button class="mode" id="m-players" onclick="pickMode('players')">👥 لاعبين</button></div>`}
function createForm(t){const g=games.find(x=>x[0]===t);window.selMode=t==='guess'?'players':'presenter';window.selRounds=t==='guess'?5:10;if(t==='family')return ffModes();set(`<div class="card"><div class="top"><div><div class="small">إنشاء غرفة</div><h1>${g[1]} ${g[2]}</h1></div><button class="btn dark" onclick="home()">رجوع</button></div>${modes(t)}<h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20,30].map(n=>`<button class="mode ${n===window.selRounds?'selected':''}" id="r${n}" onclick="pickRounds(${n})">${n} جولات</button>`).join('')}</div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%;font-size:18px" onclick="create('${t}')">✨ إنشاء الغرفة</button></div>`)}
function pickMode(m){window.selMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));document.getElementById('m-'+m)?.classList.add('selected')}
function pickRounds(n){window.selRounds=n;document.querySelectorAll('[id^=r]').forEach(x=>x.classList.remove('selected'));document.getElementById('r'+n)?.classList.add('selected')}
function ffModes(){window.ffRounds=5;set(`<div class="card"><div class="top"><h1>👨‍👩‍👧‍👦 Family Feud</h1><button class="btn dark" onclick="home()">رجوع</button></div><h3>عدد الجولات</h3><div class="grid3">${[5,10,15,20].map(n=>`<button class="mode ${n===5?'selected':''}" id="ff${n}" onclick="ffR(${n})">${n} جولات</button>`).join('')}</div><h3>طريقة اللعب</h3><div class="grid3"><button class="mode selected" onclick="ffM('presenter')">🎙️ مقدم + شاشة</button><button class="mode" onclick="ffM('display')">🖥️ شاشة + لاعبين</button><button class="mode" onclick="ffM('players')">👥 لاعبين</button></div><input id="name" class="input" placeholder="اسمك"><button class="btn primary" style="width:100%" onclick="createFF()">✨ إنشاء الغرفة</button></div>`);window.ffMode='presenter'}
function ffR(n){window.ffRounds=n;document.querySelectorAll('[id^=ff]').forEach(x=>x.classList.remove('selected'));document.getElementById('ff'+n)?.classList.add('selected')};function ffM(m){window.ffMode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));event.currentTarget.classList.add('selected')}
function createFF(){const n=document.getElementById('name')?.value.trim()||'المقدم';socket.emit('room:create',{game:'family',mode:window.ffMode,rounds:window.ffRounds||5,name:n,team:'A'})}
function create(t){const n=document.getElementById('name')?.value.trim()||'لاعب';socket.emit('room:create',{game:t,mode:window.selMode,maxRounds:window.selRounds||10,name:n})}
function joinForm(){set(`<div class="card"><div class="top"><h1>🎮 دخول غرفة</h1><button class="btn dark" onclick="home()">رجوع</button></div><p class="muted">أدخل رمز الغرفة فقط، ثم نعرض لك طريقة الدخول المناسبة.</p><input id="codeIn" class="input" maxlength="4" placeholder="A123 / B123 / C123 ..."><button class="btn red" style="width:100%" onclick="lookup()">متابعة</button></div>`)}
function lookup(){const c=document.getElementById('codeIn').value.trim().toUpperCase();if(!/^[A-G]\d{3}$/.test(c))return toast('اكتب رمزًا مثل A123');window.pending=c;socket.emit('room:inspect',{code:c})}
function joinOptions(info){const names={family:'👨‍👩‍👧‍👦 Family Feud',guess:'🧠 خمنها',market:'💰 السوق',bomb:'💣 المفخخة',last:'🏆 الصملة',bank:'🏦 البنك',million:'👑 المليون'};set(`<div class="card"><div class="top"><h1>${names[info.game]}</h1><span class="pill">${info.code}</span></div><input id="joinName" class="input" placeholder="اسمك">${info.game==='family'?'<select id="team" class="input"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select>':''}<button class="btn primary" style="width:100%" onclick="join()">دخول الغرفة</button></div>`)}
function join(){socket.emit('room:join',{code:window.pending,name:document.getElementById('joinName').value.trim()||'لاعب',team:document.getElementById('team')?.value||'A'})}
function displayForm(){set(`<div class="card"><h1>🖥️ شاشة عرض</h1><input id="dc" class="input" maxlength="4" placeholder="رمز الغرفة"><button class="btn primary" style="width:100%" onclick="socket.emit('room:display',{code:document.getElementById('dc').value.toUpperCase()})">تشغيل</button></div>`)}
function ffTeam(t){return `<div class="team ${t.id==='A'?'a':'b'}"><div><b>${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</b></div><div class="score">${t.score}</div><div>${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="small">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد لاعبين'}</div></div>`}
function ffAnswers(){return (G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.points} نقطة</span>`:'؟'}${(role==='presenter'||(role==='player'&&G.mode!=='presenter'))&&!a.revealed?`<button class="btn red" style="margin-top:8px" onclick="ffReveal(${i})">كشف</button>`:''}${a.revealed&&!a.awarded&&(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<div class="row" style="margin-top:8px"><button class="btn red" onclick="ffAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="ffAward(${i},'B')">🔵 +${a.points}</button></div>`:''}</div>`).join('')}
function ffScreen(){set(`<div class="card"><div class="top"><div><div class="small">رمز الغرفة</div><div class="code">${G.code}</div></div><div class="pill">الجولة ${G.currentRound}/${G.rounds}</div></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="q">${esc(G.question||'بانتظار السؤال…')}</div>${G.lock&&role==='display'?`<div class="buzz">🔔 ${esc(G.lock.name)} ضغط أولًا — ${G.lock.team==='A'?'الفريق الأحمر':'الفريق الأزرق'}<div class="small">الضغط يظهر هنا على شاشة العرض فقط</div></div>`:''}${G.answerLock?`<div class="buzz">✍️ ${esc(G.answerLock.name)} يجيب الآن</div>`:''}<div class="answers">${ffAnswers()}</div><div class="row" style="margin-top:15px">${role==='presenter'?`<button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ الجولة':'سؤال عشوائي'}</button>`:''}${(role==='presenter'||role==='player'&&G.mode!=='presenter')?`<button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button>`:''}</div></div>`)}

function millionStart(){sound('million');socket.emit('million:start')};function millionAnswer(i){sound('click');socket.emit('million:answer',{index:i})};function millionWalk(){socket.emit('million:walk')};function millionLife(t){sound('click');socket.emit('million:lifeline',{type:t})}
function millionDisplay(){const h=G.history||[],last=h[h.length-1];set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">المليون • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">${G.turnPlayer?'🔥 دور '+esc(G.players.find(p=>p.id===G.turnPlayer)?.name||''):'انتهت اللعبة'}</span></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><b>${esc(p.name)}</b><div class="score">${(x.bank||0).toLocaleString()}</div><div class="small">${x.active?'مستمر':'انتهى'}</div></div>`}).join('')}</div>${last?`<div class="winner stageFlash"><h2>آخر إجابة</h2><p><b>${esc(last.name||'')}</b> — ${esc(last.question||'')}</p><p>${last.walk?'🏳️ انسحب':last.correct?'✅ صحيح':'❌ خطأ'}</p><div class="score">${(last.amountAfter||0).toLocaleString()}</div></div>`:''}<h2>سجل الإجابات</h2>${h.slice(-12).reverse().map(x=>`<div class="scoreline"><span>${esc(x.name||'')} — ${esc(x.question||'')}</span><b>${x.correct?'صح':x.walk?'انسحاب':'خطأ'}</b></div>`).join('')}</div>`)}
function millionPresenter(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم • المليون</div><div class="code">${G.code}</div></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="winner"><h2>${G.turnPlayer?'دور: '+esc(G.players.find(p=>p.id===G.turnPlayer)?.name||''):'جاهز'}</h2><button class="btn gold" onclick="millionStart()">🔥 بدء اللعبة</button></div>${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="scoreline"><span>${esc(p.name)} ${G.turnPlayer===p.id?'🔥':''}</span><b>${(x.bank||0).toLocaleString()}</b></div>`}).join('')}</div>`)}

function miniRender(){const out=miniPlayer();set(`<div class="card">${out}</div>`);if(G.type==='last'&&G.phase==='turn'&&G.turnPlayer===me&&G.turnOrder?.length)tick(G.answerUntil||Date.now()+10000,'lat');if(G.type==='bomb'&&G.phase==='bombAnswer')tick(G.answerUntil,'bat')}
function miniDisplay(){const title={bomb:'💣 المفخخة',last:'⚔️ الصملة',bank:'🏦 البنك'}[G.type];let content;if(G.phase==='lobby')content=`<div class="miniHero"><div style="font-size:90px">${G.type==='bomb'?'💣':G.type==='last'?'⚔️':'🏦'}</div><h1>${title}</h1><p class="sub">بانتظار بدء اللعبة • ${G.maxRounds} جولات</p></div>`;else if(G.type==='bomb')content=`<div class="marketQ">${esc(G.question)}</div><div class="winner stageFlash"><h1>${G.phase==='bombResult'?(G.result?.kind==='trap'?'💥 مفخخة!':G.result?.kind==='outside'?'🟡 صحيحة خارج اللائحة':G.result?.kind==='listed'?'✅ صحيحة':'❌ خطأ'):`🔥 ${esc(G.current?.name||'استعدوا')}`}</h1><p>اللائحة تحتوي ${G.answers?.length||0} إجابات</p>${G.phase==='bombAnswer'?'<div class="timer" id="bat">3</div>':''}</div>`;else if(G.type==='last')content=`<div class="marketQ">${esc(G.question)}</div><div class="winner"><h1>${G.phase==='turn'?'دور: '+esc(G.players.find(p=>p.id===G.turnPlayer)?.name||'—'):'نتيجة الجولة'}</h1>${G.roundAnswers?Object.values(G.roundAnswers).map(x=>`<div class="scoreline"><span>${esc(x.name)} — ${esc(x.answer)} ${x.duplicate?'⚠️ تطابق':''}</span><b>${x.duplicate||!x.valid?'-1':'+1'}</b></div>`).join(''):''}</div>`;else content=`<div class="marketQ">${esc(G.question)}</div><div class="grid">${G.players.map(p=>`<div class="game"><b>${esc(p.name)}</b><div class="score">${(G.balances?.[p.id]??10000).toLocaleString()}</div><div class="small">${G.roundDone?.[p.id]?(G.roundDone[p.id].ok?'✅ نجح':'❌ خسر'):''}</div></div>`).join('')}</div>`;set(`<div class="card" style="min-height:90vh"><div class="top"><div><div class="small">${title} • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">${G.round}/${G.maxRounds}</span></div>${content}</div>`);if(G.phase==='bombAnswer')tick(G.answerUntil,'bat')}
function miniPresenter(){const title={bomb:'💣 المفخخة',last:'⚔️ الصملة',bank:'🏦 البنك'}[G.type];set(`<div class="card"><div class="top"><div><h1>${title}</h1><span class="code">${G.code}</span></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="miniHero"><h2>${esc(G.question||'جاهز؟')}</h2><p>الجولة ${G.round}/${G.maxRounds}</p><button class="btn gold" onclick="${G.phase==='lobby'?'ms()':G.type==='bomb'?'bombNext()':G.type==='last'?'lastNext()':'bankNext()'}">${G.phase==='lobby'?'🚀 بدء الجولة':'الجولة التالية ▶'}</button></div>${G.players.map(p=>`<div class="scoreline"><span>${esc(p.name)}</span><b>${G.type==='bank'?(G.balances?.[p.id]??10000):G.scores?.[p.id]||0}</b></div>`).join('')}</div>`)}

function ffDisplay(){set(`<div class="card" style="min-height:90vh;background:radial-gradient(circle at 50% 0,rgba(124,92,255,.16),transparent 38%),linear-gradient(180deg,#090b14,#05060b)"><div class="top"><div><div class="small">الساحة • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">${G.currentRound||0} / ${G.rounds||0}</span></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="q">${esc(G.question||'بانتظار المقدم…')}</div>${G.lock?`<div class="buzz stageFlash">🔔 ${esc(G.lock.name)} ضغط أولًا — ${G.lock.team==='A'?'الفريق الأحمر':'الفريق الأزرق'}</div>`:''}${G.answerLock?`<div class="buzz stageFlash">${G.answerLock.double?'⚡ دبل — ':''}✍️ ${esc(G.answerLock.name)} يجيب الآن <span class="pill">10 ث</span></div>${G.answerLock.double?'<div class="doubleStorm"><div class="stormTitle">⚡ دبل!<small>النقاط ×2</small></div></div>':''}`:''}<div class="answers">${(G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.awardedPoints||a.points} نقطة</span>`:'؟'}</div>`).join('')}</div></div>`)}
function ffPresenter(){set(`<div class="card" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم</div><div class="code">${G.code}</div></div><div class="row"><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ فتح الشاشة</button><button class="btn dark" onclick="home()">الرئيسية</button></div></div><div class="teams">${G.teams.map(ffTeam).join('')}</div><div class="notice">${G.phase==='lobby'?'جاهز للجولة؟ اختر سؤالًا عشوائيًا وابدأ.':`السؤال الحالي: ${esc(G.question)}`}</div><div class="q">${esc(G.question||'بانتظار بدء الجولة…')}</div><div class="answers">${(G.answers||[]).map((a,i)=>`<div class="ans ${a.revealed?'reveal':'hidden'}">${a.revealed?`<b>${esc(a.text)}</b><span class="small">${a.points} نقطة</span>`:'؟'}${!a.revealed?`<button class="btn red" style="margin-top:8px" onclick="ffReveal(${i})">كشف</button>`:''}${a.revealed&&!a.awarded?`<div class="row" style="margin-top:8px"><button class="btn red" onclick="ffAward(${i},'A')">🔴 +${a.points}</button><button class="btn blue" onclick="ffAward(${i},'B')">🔵 +${a.points}</button></div>`:''}</div>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn gold" onclick="ffStart()">🎲 ${G.phase==='lobby'?'ابدأ الجولة':'سؤال عشوائي'}</button><button class="btn blue" onclick="ffChange()">🔄 تغيير السؤال</button><button class="btn danger" onclick="ffStrike('A')">Strike 🔴</button><button class="btn danger" onclick="ffStrike('B')">Strike 🔵</button></div></div>`)}
function marketDisplay(){const last=G.history?.[G.history.length-1];set(`<div class="card" style="min-height:90vh;text-align:center"><div class="top"><div><div class="small">السوق • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">الجولة ${G.round||0}</span></div>${G.phase==='lobby'?`<div class="miniHero"><div style="font-size:90px">🛒</div><h1>السوق</h1><p class="sub">بانتظار المقدم…</p></div>`:G.phase==='countdown'?`<div class="marketQ">${esc(G.question)}</div><span class="pointsTag">${G.points} نقطة</span><div class="timer" id="mcd">3</div>`:G.phase==='buzz'?`<div class="marketQ">${esc(G.question)}</div><span class="pointsTag">${G.points} نقطة</span><div class="press">🔔 اضغط</div>`:G.phase==='answer'?`<div class="marketQ">${esc(G.question)}</div><div class="winner stageFlash"><h1>🎙️ ${esc(G.current?.name)}</h1><p>هو صاحب الدور</p><div class="timer" id="mat">5</div></div>`:G.phase==='vote'?`<div class="winner"><h1>هل كانت الإجابة صحيحة؟</h1><h2>${esc(G.current?.name)}</h2><div class="pill">نعم: ${Object.values(G.votes||{}).filter(v=>v==='yes').length} • لا: ${Object.values(G.votes||{}).filter(v=>v==='no').length}</div></div>`:`<div class="winner stageFlash"><h1>${last?.result==='صحيح'?'✅ إجابة صحيحة':'❌ إجابة غير صحيحة'}</h1><div class="score">${last?.delta>0?'+':''}${last?.delta||0}</div><p>نقاط الجولة</p></div>`}<div class="grid">${G.players.map(p=>`<div class="scoreline"><span>${esc(p.name)}</span><b>${G.scores[p.id]||0}</b></div>`).join('')}</div></div>`);if(G.phase==='countdown')tick(G.countdownUntil,'mcd');if(G.phase==='answer')tick(G.answerUntil,'mat')}
function marketPresenter(){marketRender();}
function millionDisplay(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">المليون • شاشة العرض</div><div class="code">${G.code}</div></div><span class="pill">كل لاعب في مساره</span></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><b>${esc(p.name)}</b><div class="score">${(x.bank||0).toLocaleString()}</div><div class="small">${x.active?'🔥 مستمر':'⏸️ متوقف'}</div></div>`}).join('')}</div></div>`)}
function millionPresenter(){set(`<div class="card million" style="min-height:90vh"><div class="top"><div><div class="small">لوحة المقدم • المليون</div><div class="code">${G.code}</div></div><button class="btn dark" onclick="window.open('/display?code=${G.code}','_blank')">🖥️ الشاشة</button></div><div class="grid">${G.players.map(p=>{const x=G.playersState?.[p.id]||{};return `<div class="game"><h2>${esc(p.name)}</h2><div class="score">${(x.bank||0).toLocaleString()}</div><p>${x.active?'مستمر':'متوقف'}</p></div>`}).join('')}</div><button class="btn gold" onclick="millionStart()">🔥 بدء اللعبة</button></div>`)}
function miniDisplay(){miniRender();}
function miniPresenter(){miniRender();}

function render(){if(!G)return home();if(G.type==='family')return role==='display'?ffDisplay():role==='presenter'?ffPresenter():ffPlayer();if(G.type==='guess')return guessRender();if(G.type==='market')return role==='display'?marketDisplay():marketRender();if(G.type==='million')return role==='display'?millionDisplay():role==='presenter'?millionPresenter():millionRender();return role==='display'?miniDisplay():role==='presenter'?miniPresenter():miniRender()}
socket.on('room:created',x=>{code=x.code;role=x.role;me=x.playerId||null;mode=x.mode||'';history.replaceState({},'',`/${role==='presenter'?'presenter':role==='display'?'display':'player'}?code=${code}`);});socket.on('joined',x=>{code=x.code;role='player';me=x.playerId});socket.on('display:ok',x=>{code=x.code;role='display'});socket.on('room:info',joinOptions);let prevPhase='';socket.on('state',s=>{const old=G;G=s;const changed=s?.phase!==prevPhase;prevPhase=s?.phase||'';if(changed){if(s.phase==='countdown')sound('countdown');else if(s.phase==='buzz'||s.phase==='question')sound('buzz');else if(s.phase==='answer'||s.phase==='bombAnswer'||s.phase==='turn')sound('suspense');else if(s.phase==='vote')sound('vote');else if(s.phase==='results'||s.phase==='lastResult'||s.phase==='bankResult')sound('win');else if(s.phase==='finished')sound('win');}if(s?.type==='bomb'&&s.phase==='bombResult')sound(s.result?.kind==='trap'?'explosion':s.result?.kind==='listed'||s.result?.kind==='outside'?'correct':'wrong');if(s?.type==='family'&&s.answerLock?.double) sound('suspense');render()});socket.on('errorMsg',toast);socket.on('ff:wrong',x=>{sound('wrong');toast(`❌ خطأ — Strike ${x.strikes}/3`)});socket.on('ff:correct',x=>{sound('win');toast(x.smart?`🧠 تم احتسابها من قبل التصحيح الذكي — +${x.points}`:`✅ إجابة صحيحة +${x.points}`)});socket.on('guess:correct',x=>{sound('win');toast(`🎉 صحيح +${x.points}`)});socket.on('guess:wrong',()=>{sound('wrong');toast('❌ ليست هي')});socket.on('market:wrong',()=>sound('wrong'));socket.on('market:vote',()=>sound('vote'));socket.on('guess:revealed',()=>sound('reveal'));socket.on('million:audience',()=>sound('vote'));socket.on('million:win',x=>{sound('win');toast(`👑 مليون! ${x.name}`)});socket.on('million:wrong',x=>{sound('wrong');toast(`❌ ${x.name} عاد إلى ${x.bank}`)});const pathName=location.pathname;if(pathName==='/display'){role='display';const q=new URLSearchParams(location.search).get('code');if(q)socket.emit('room:display',{code:q});else displayForm();}else if(pathName==='/presenter'){role='presenter';const q=new URLSearchParams(location.search).get('code');if(q){code=q;socket.emit('room:presenter',{code:q})}else home();}else if(pathName==='/player'){role='player';const q=new URLSearchParams(location.search).get('code');if(q){window.pending=q;joinForm()}else home();}else home();
</script></body></html>
